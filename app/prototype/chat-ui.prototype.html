<body>
<div class="plan"><b>原型（用完即弃）</b>：研发团队 Agent 对话 App 的 3 种布局。用 HTML 模拟 macOS 窗口，内容是示意数据。底部的条：← → 换方案，↑ ↓ 或数字键 1-6 换演示步骤。第 1 步登录在 3 个方案里相同。</div>
<div class="win" id="win"></div>
<div class="switcher">
  <button class="arrow" id="prev" title="上一个方案（←）">‹</button>
  <span id="vlabel"></span>
  <button class="arrow" id="next" title="下一个方案（→）">›</button>
  <span class="sep"></span>
  <div id="steps"></div>
  <span class="sep"></span>
  <span class="tag">原型</span>
</div>
<script>
window.addEventListener('error', function (e) {
  var box = document.createElement('pre');
  box.className = 'err';
  box.textContent = '原型脚本出错：' + e.message + ' (line ' + e.lineno + ')';
  document.body.insertBefore(box, document.body.firstChild);
});

// ---------- mock data (illustrative) ----------
const STEPS = ['登录', '追问需求', '后台生成中', 'PRD 已生成', '确认保存', '已保存'];
const SESSIONS = [
  { g: '今天', items: [{ t: 'CSV 批量导入用户 PRD', active: true }] },
  { g: '昨天', items: [{ t: '导出用户列表到 Excel' }] },
  { g: '10 月 27 日', items: [{ t: '管理员审计日志需求' }] },
];
const ATTACH = [
  { kind: 'MD', name: '用户反馈汇总.md', meta: '12 KB' },
  { kind: 'PDF', name: '现有用户管理说明.pdf', meta: '11 页 · 提取 8,420 字' },
];
const QUESTIONS = [
  '单次上限还是 10,000 行吗？要不要提高？',
  '邮箱和已有用户重复时：跳过、更新已有用户，还是整行报错？',
  '导入完成后，管理员怎么拿到失败明细：页面上下载错误报告，还是同时发邮件？',
];
const PHASES = ['检索附件和示例代码', '生成 PRD 正文', '校验章节和代码引用', '保存结果'];
const PRD = { title: 'CSV Batch User Import', version: '第 1 版', sections: 24, size: '52 KB', warnings: 2,
  attach: 2, codeRefs: 9, repo: 'rd-team-agent-sample-app', commit: 'a41c9e2' };
const SAVE = { repo: 'kluacisco888/rd-team-agent-prds', path: 'prds/2026-10-30-csv-batch-user-import-v1.md',
  msg: 'Add PRD: CSV Batch User Import v1 (demo-user-1)', commit: '9c1e2f0' };
const MEMORY = [
  { t: '偏好', s: '验收标准写成 Given / When / Then' },
  { t: '事实', s: '示例产品现在只能在表单里逐个建用户' },
  { t: '摘要', s: '昨天的会话：定了导出 Excel 的字段范围' },
];
const SECTIONS = ['1. Document Control', '2. Executive Summary', '3. Background and Problem', '4. Goals', '5. Non-Goals',
  '6. Personas', '7. Scope', '8. User Flow', '9. Job State Model', '10. Functional Requirements', '11. Error Handling',
  '12. Data Model', '13. API Contract', '14. Security and Privacy', '15. Non-Functional Requirements',
  '16. Analytics and Success Metrics', '17. Code Impact', '18. Dependencies', '19. Rollout and Rollback',
  '20. Risks and Mitigations', '21. Open Questions', '22. Evidence Ledger', '23. Definition of Ready', '24. Definition of Done'];
const FRONT = [
  ['admin-console/src/routes/users/import/index.tsx', 'Add import route and page orchestration'],
  ['admin-console/src/components/user-import/FilePicker.tsx', 'Add CSV selection and advisory validation'],
  ['admin-console/src/components/user-import/ImportProgress.tsx', 'Display job state and progress'],
  ['admin-console/src/api/userImports.ts', 'Add typed API client'],
];
const BACK = [
  ['services/admin-api/src/routes/user_imports.py', 'Add submission, status, list, cancellation, and report routes'],
  ['services/user-import-worker/src/importer.py', 'Add idempotent user mutation'],
  ['services/user-import-worker/src/error_report.py', 'Generate formula-safe CSV error reports'],
  ['services/user-import-worker/src/state_machine.py', 'Enforce job-state transitions'],
];

function threadItems(step) {
  const t = [];
  if (step >= 2) {
    t.push({ who: 'user', html: '帮我写一个 PRD：管理员可以上传 CSV，批量导入用户。背景材料在附件里。', attach: true });
    t.push({ who: 'agent', html: '我读了你附带的 2 份文档，也查了示例代码仓 <code>' + PRD.repo + '</code> 里现有的用户管理代码。动笔前想确认 3 点：<ol>' +
      QUESTIONS.map(q => '<li>' + q + '</li>').join('') + '</ol>' });
  }
  if (step >= 3) {
    t.push({ who: 'user', html: '1. 保持 10,000 行。<br>2. 跳过，并在错误报告里列出。<br>3. 页面上下载就行。' });
    t.push({ who: 'agent', html: '清楚了，开始生成 PRD。大约要 9 分钟，生成在后台进行，关掉 App 也不影响，回来时结果会在这个会话里。' });
    t.push({ kind: 'progress' });
  }
  if (step >= 4) {
    t.push({ who: 'agent', html: 'PRD 第 1 版生成好了，校验通过，本机也存了一份。要保存到 GitHub 的 PRD 文档库吗？保存前我会再请你确认一次。' });
    t.push({ kind: 'prd' });
  }
  if (step >= 5) {
    t.push({ who: 'user', html: '保存到 GitHub' });
    t.push({ kind: 'confirm' });
  }
  if (step >= 6) t.push({ kind: 'saved' });
  return t;
}

// ---------- shared pieces ----------
const $ = s => document.querySelector(s);
let ddOpen = false;

function titlebar(center, right) {
  return '<div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><div class="wtitle">研发团队 Agent</div>' +
    (center || '') + '<div class="tb-right">' + (right || '') + '</div></div>';
}
function sessions() {
  return SESSIONS.map(g => '<div class="grp">' + g.g + '</div>' +
    g.items.map(s => '<div class="sess' + (s.active ? ' active' : '') + '">' + s.t + '</div>').join('')).join('');
}
function account() {
  return '<div class="acct"><span class="avatar">U1</span><div><div class="nm">demo-user-1</div>' +
    '<div class="sub muted">Cognito 测试账号</div></div><span class="r muted">▾</span></div>';
}
function attachChips() {
  return '<div class="chips">' + ATTACH.map(a => '<span class="chip"><b class="ft ' + a.kind + '">' + a.kind + '</b>' +
    a.name + '<em>' + a.meta + '</em></span>').join('') + '</div>';
}
function fileList() {
  return '<div class="flist">' + ATTACH.map(a => '<div class="fitem"><b class="ft ' + a.kind + '">' + a.kind + '</b><div><div>' +
    a.name + '</div><div class="muted">' + a.meta + '</div></div></div>').join('') + '</div>';
}
function msgHTML(m) {
  if (m.who === 'user') return '<div class="msg user"><div class="bubble">' + m.html + (m.attach ? attachChips() : '') + '</div></div>';
  return '<div class="msg agent"><div class="av">A</div><div class="bubble">' + m.html + '</div></div>';
}
function line(dot, text) {
  return '<div class="sysline"><span class="dot ' + dot + '"></span>' + text + '</div>';
}
function composer(center) {
  return '<div class="composer' + (center ? ' center' : '') + '"><div class="cbox"><button class="clip" title="附件">＋</button>' +
    '<div class="cinput">回复，或拖入 .md / PDF 文件…</div><button class="send">↑</button></div>' +
    '<div class="chint">附件支持 .md 和 PDF（PDF 在本机提取文字），最多 20 份、共 2 MB；只对这一次任务可见</div></div>';
}
function progressCard(step) {
  const running = step === 3;
  const st = running ? ['done', 'run', 'todo', 'todo'] : ['done', 'done', 'done', 'done'];
  return '<div class="card"><div class="card-h"><span class="dot ' + (running ? 'run' : 'ok') + '"></span><b>' +
    (running ? 'PRD 生成中（后台任务）' : 'PRD 生成完成') + '</b><span class="muted r">' +
    (running ? '已用 03:40 · 预计还要约 5 分钟' : '用时 8 分 47 秒') + '</span></div>' +
    '<div class="bar"><i style="width:' + (running ? 42 : 100) + '%"></i></div><ul class="phases">' +
    PHASES.map((p, i) => '<li class="' + st[i] + '"><span class="pi"></span>' + p + '</li>').join('') + '</ul>' +
    (running ? '<div class="note">可以关掉 App。App 定时查进度，查进度不经过模型。</div>' : '') + '</div>';
}
function prdCard(step) {
  return '<div class="card"><div class="card-h"><span class="ficon">MD</span><div><b>' + PRD.title + '</b><div class="muted">' +
    PRD.version + ' · ' + PRD.sections + ' 节 · ' + PRD.size + '</div></div><span class="badge ok r">校验通过</span></div>' +
    '<div class="facts"><span>依据：附件 ' + PRD.attach + ' 份，代码引用 ' + PRD.codeRefs + ' 处（' + PRD.repo + ' @ ' + PRD.commit + '）</span>' +
    '<span>警告 ' + PRD.warnings + ' 条，不影响使用</span></div><div class="btns"><button class="btn">预览全文</button>' +
    '<button class="btn">在 Finder 中显示</button><button class="btn primary"' + (step >= 5 ? ' disabled' : '') + '>保存到 GitHub…</button></div></div>';
}
function confirmTable() {
  return '<table class="kv"><tr><th>写到</th><td><code>' + SAVE.repo + '</code></td></tr><tr><th>文件</th><td><code>' + SAVE.path +
    '</code></td></tr><tr><th>提交说明</th><td>' + SAVE.msg + '</td></tr><tr><th>提交作者</th><td>kluacisco888（令牌的主人）</td></tr></table>';
}
function confirmCard(step) {
  const done = step >= 6;
  return '<div class="card t2' + (done ? ' resolved' : '') + '"><div class="card-h"><span class="badge warn">需要你确认 · T2</span><b>把 PRD 写进 GitHub</b></div>' +
    '<p class="muted">这一步会写入外部系统。你确认后，编排 Agent 才会调用 <code>save_prd_to_github</code>。</p>' + confirmTable() +
    (done ? '<div class="resolved-line">✓ 你在 15:42 确认了</div>'
          : '<div class="btns"><button class="btn">取消</button><button class="btn primary">确认保存</button></div>') + '</div>';
}
function savedCard() {
  return '<div class="card saved"><span class="dot ok"></span><div><b>已保存到 GitHub</b><div class="muted"><code>' + SAVE.repo +
    '</code> · 提交 <code>' + SAVE.commit + '</code></div><div class="muted"><code>' + SAVE.path + '</code></div></div>' +
    '<button class="btn r">在 GitHub 打开</button></div>';
}

// ---------- step 1: login (same for all variants) ----------
function loginView() {
  return titlebar() + '<div class="body"><div class="login"><div class="lcard dim"><div class="appicon">PRD</div>' +
    '<div style="font-size:18px;font-weight:700">研发团队 Agent</div><div class="muted" style="margin:4px 0 14px">用公司账号登录后开始对话</div>' +
    '<button class="btn primary big">登录</button></div><div class="websheet"><div class="urlbar">rd-team-agent.auth.us-east-1.amazoncognito.com</div>' +
    '<div class="cog"><div style="font-size:17px;font-weight:700;margin-bottom:14px">Sign in</div><label class="muted">Username</label>' +
    '<div class="field">demo-user-1</div><label class="muted">Password</label><div class="field">••••••••••••</div>' +
    '<button class="btn primary big" style="width:100%">Sign in</button><div class="muted" style="font-size:11px;margin-top:12px">' +
    '系统登录窗口里打开的 Cognito 托管登录页（替身）。测试账号由管理员创建，不开放注册；以后换成公司的 Entra 或 Okta 登录页。</div></div></div></div></div>';
}

// ---------- variant A: three columns + inspector ----------
function renderA(step) {
  const items = threadItems(step).map(m => {
    if (m.kind === 'progress') return line(step === 3 ? 'run' : 'ok', step === 3 ? 'PRD 生成中 · 第 2/4 步 · 详情见右侧「本次任务」' : 'PRD 生成完成 · 用时 8 分 47 秒');
    if (m.kind === 'prd') return line('ok', 'PRD 第 1 版 · 24 节 · 校验通过 · 见右侧');
    if (m.kind === 'confirm') return line(step === 5 ? 'wait' : 'ok', step === 5 ? '等你在右侧确认：写入 GitHub（T2）' : '你确认了写入 GitHub');
    if (m.kind === 'saved') return line('ok', '已保存 · 提交 <code>' + SAVE.commit + '</code>');
    return msgHTML(m);
  }).join('');
  let task;
  if (step === 2) task = '<div class="empty">还没开始生成。需求问清楚后，进度和结果显示在这里。</div>';
  else if (step === 3) task = progressCard(3);
  else if (step === 4) task = prdCard(4);
  else if (step === 5) task = confirmCard(5) + prdCard(5);
  else task = savedCard() + prdCard(6);
  const insp = '<div><div class="ih">本次任务</div><div class="stack">' + task + '</div></div>' +
    '<div><div class="ih">附件 · 只对这次任务可见</div>' + fileList() + '</div>' +
    '<div><div class="ih">我的长期记忆</div><div class="mem">' + MEMORY.map(x => '<div><span class="mtag">' + x.t + '</span><span>' + x.s + '</span></div>').join('') +
    '</div><div class="muted" style="font-size:11px;margin-top:6px">按账号分开存，别人的会话里看不到。</div></div>';
  return titlebar() + '<div class="body"><aside class="side">' + account() + '<button class="newbtn">＋ 新会话</button>' + sessions() +
    '</aside><section class="chat"><div class="thread">' + items + '</div>' + composer(false) + '</section><aside class="insp">' + insp + '</aside></div>';
}

// ---------- variant B: single chat column, everything inline ----------
function renderB(step) {
  const items = threadItems(step).map(m => {
    if (m.kind === 'progress') return progressCard(step);
    if (m.kind === 'prd') return prdCard(step);
    if (m.kind === 'confirm') return confirmCard(step);
    if (m.kind === 'saved') return savedCard();
    return msgHTML(m);
  }).join('');
  return titlebar() + '<div class="body"><aside class="side dark"><button class="newbtn">＋ 新会话</button>' + sessions() +
    '<div class="spacer"></div>' + account() + '</aside><section class="chat center"><div class="thread"><div class="col">' + items +
    '</div></div>' + composer(true) + '</section></div>';
}

// ---------- variant C: chat + PRD document canvas ----------
function outline(step) {
  return '<nav class="outline">' + SECTIONS.map((s, i) => {
    const cls = step === 3 ? 'pending' : (i === 16 ? 'sel' : '');
    return '<div class="' + cls + '">' + s + '</div>';
  }).join('') + '</nav>';
}
function docSection() {
  const rows = r => r.map(x => '<tr><td><code>' + x[0] + '</code></td><td>' + x[1] + '</td></tr>').join('');
  return '<div class="muted" style="font-size:11px">第 17 / 24 节 · 正文是示意</div><h2>17. Code Impact</h2>' +
    '<div class="muted">Evidence: <code>' + PRD.repo + '</code> @ <code>' + PRD.commit + '</code>, retrieved for this task.</div>' +
    '<h3>17.1 Simulated Frontend Impact</h3><table class="dtable"><tr><th>Path</th><th>Change</th></tr>' + rows(FRONT) + '</table>' +
    '<h3>17.2 Simulated Backend Impact</h3><table class="dtable"><tr><th>Path</th><th>Change</th></tr>' + rows(BACK) + '</table>';
}
function canvasC(step) {
  if (step === 2) {
    return '<div class="cv-h"><div><div class="t">PRD</div><div class="m muted">还没生成</div></div></div><div class="cv-body"><div class="cv-empty">' +
      '<div class="h">PRD 会在这里显示</div><div>先在左边把需求说清楚。生成时会用到这些依据：</div><div class="srcs">' +
      ATTACH.map(a => '<div class="fitem"><b class="ft ' + a.kind + '">' + a.kind + '</b><div><div>' + a.name + '</div><div class="muted">' + a.meta + '</div></div></div>').join('') +
      '<div class="fitem"><b class="ft CODE">CODE</b><div><div>' + PRD.repo + ' @ ' + PRD.commit + '</div><div class="muted">示例代码仓，已同步进知识库</div></div></div></div></div></div>';
  }
  if (step === 3) {
    return '<div class="cv-h"><div><div class="t">' + PRD.title + '</div><div class="m"><span class="badge run">生成中</span><span class="muted">已用 03:40</span></div></div></div>' +
      '<div class="cv-body">' + outline(3) + '<div class="doc">' + progressCard(3) +
      '<div class="skel"><div class="muted" style="margin-top:16px">生成完并通过校验后，正文显示在这里。</div><i></i><i></i><i class="s"></i><i></i><i class="s"></i></div></div></div>';
  }
  const saved = step === 6 ? '<span class="badge ok">已保存到 GitHub · ' + SAVE.commit + '</span>' : '';
  return '<div class="cv-h"><div><div class="t">' + PRD.title + '</div><div class="m"><span class="muted">' + PRD.version + ' · ' + PRD.sections + ' 节 · ' +
    PRD.size + '</span><span class="badge ok">校验通过</span>' + saved + '</div></div><div class="r btnrow"><button class="btn">另存为 .md</button>' +
    '<button class="btn">在 Finder 中显示</button><button class="btn primary"' + (step >= 5 ? ' disabled' : '') + '>保存到 GitHub…</button></div></div>' +
    '<div class="cv-body">' + outline(4) + '<div class="doc">' + docSection() + '</div></div>';
}
function renderC(step) {
  const items = threadItems(step).map(m => {
    if (m.kind === 'progress') return line(step === 3 ? 'run' : 'ok', step === 3 ? 'PRD 生成中，进度见右侧' : 'PRD 生成完成，已在右侧打开');
    if (m.kind === 'prd') return '';
    if (m.kind === 'confirm') return line(step === 5 ? 'wait' : 'ok', step === 5 ? '等你确认：写入 GitHub（T2）' : '你确认了写入 GitHub');
    if (m.kind === 'saved') return line('ok', '已保存 · 提交 <code>' + SAVE.commit + '</code>');
    return msgHTML(m);
  }).join('');
  const center = '<div class="tb-sess"><button class="tbtn" id="ddbtn">CSV 批量导入用户 PRD ▾</button>' +
    (ddOpen ? '<div class="dd">' + sessions() + '<div class="ddsep"></div><div class="sess">＋ 新会话</div></div>' : '') + '</div>';
  const right = '<span class="avatar sm">U1</span><span>demo-user-1 ▾</span>';
  const sheet = step === 5 ? '<div class="sheet-bg"></div><div class="sheet"><div class="card-h"><span class="badge warn">需要你确认 · T2</span></div>' +
    '<h3>把 PRD 写进 GitHub？</h3><p class="muted" style="margin:0 0 4px;font-size:12px">这一步会写入外部系统。你确认后，编排 Agent 才会调用 <code>save_prd_to_github</code>。</p>' +
    confirmTable() + '<div class="btns"><button class="btn">取消</button><button class="btn primary">确认保存</button></div></div>' : '';
  return titlebar(center, right) + '<div class="body"><section class="cchat"><div class="thread">' + items + '</div>' + composer(false) +
    '</section><section class="canvas">' + canvasC(step) + '</section></div>' + sheet;
}

// ---------- switcher ----------
const VARIANTS = [
  { key: 'A', name: '三栏 + 检查器', render: renderA },
  { key: 'B', name: '单栏对话，卡片内联', render: renderB },
  { key: 'C', name: '对话 + PRD 文档画布', render: renderC },
];
function readURL() {
  const p = new URLSearchParams(location.search);
  let v = (p.get('variant') || 'A').toUpperCase();
  if (!VARIANTS.some(x => x.key === v)) v = 'A';
  let s = parseInt(p.get('step') || '4', 10);
  if (!(s >= 1 && s <= 6)) s = 4;
  return { variant: v, step: s };
}
const state = readURL();
function writeURL() {
  try {
    const u = new URL(location.href);
    u.searchParams.set('variant', state.variant);
    u.searchParams.set('step', String(state.step));
    history.replaceState(null, '', u);
  } catch (e) { /* file:// may refuse; the switcher still works */ }
}
function render() {
  const v = VARIANTS.find(x => x.key === state.variant);
  $('#win').innerHTML = state.step === 1 ? loginView() : v.render(state.step);
  $('#vlabel').textContent = v.key + ' · ' + v.name;
  $('#steps').innerHTML = STEPS.map((s, i) => '<button class="stp' + (state.step === i + 1 ? ' on' : '') + '" data-step="' + (i + 1) + '">' + (i + 1) + ' ' + s + '</button>').join('');
  document.querySelectorAll('.thread').forEach(t => { t.scrollTop = t.scrollHeight; });
  writeURL();
}
function cycle(d) {
  const i = VARIANTS.findIndex(x => x.key === state.variant);
  state.variant = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key;
  ddOpen = false;
  render();
}
function go(s) {
  state.step = Math.min(6, Math.max(1, s));
  ddOpen = false;
  render();
}
$('#prev').addEventListener('click', () => cycle(-1));
$('#next').addEventListener('click', () => cycle(1));
$('#steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) go(+b.dataset.step); });
document.addEventListener('click', e => { if (e.target.closest('#ddbtn')) { ddOpen = !ddOpen; render(); } });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && t.closest && t.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') { cycle(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { cycle(1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { go(state.step - 1); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { go(state.step + 1); e.preventDefault(); }
  else if (/^[1-6]$/.test(e.key)) go(+e.key);
});
render();
</script>
</body>
